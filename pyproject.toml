[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formula1-race-results-web-app"
version = "0.2.0"
description = "Add your description here"
authors = [{name = "KrisKulbych", email = "k.kulbych@gmail.com"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask-caching>=2.3.1",
    "flask>=3.1.1",
    "pydantic-settings>=2.9.1",
    "formula1-race-analysis==2.0.1",
    "pydantic>=2.11.7",
    "fastapi==0.116.1",
    "fastapi-cache2>=0.2.2",
    "uvicorn==0.40.0",
]

[dependency-groups]
dev = [
    "pytest-cov>=6.2.1",
    "pytest>=8.4.0",
    "httpx[cli]>=0.28.1",
]
lint = [
    "mypy>=1.16.1",
    "pre-commit>=4.2.0",
    "ruff>=0.11.13",
]

[project.scripts]
formula1-app = "main:main"
formula1-api = "formula1_web_app.api.app:run"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
formula1_web_app = ["templates/*.html", "static/**/*"]

[tool.uv]
index-strategy = "unsafe-best-match"
package = true

[tool.uv.sources]
formula1-race-analysis = { index = "testpypi" }

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"

[tool.uv.workspace]
exclude = ["tests/*"]

[tool.pytest.ini_options]
addopts = "-v --cov=src --cov-fail-under=90"
pythonpath = ["src"]
testpaths = [
    "tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "src/main.py",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = ["F401", "D", "S", "COM812"]

[tool.ruff.format]
indent-style = "space"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_no_return = true
show_error_context = true
show_column_numbers = true
warn_unused_configs = true
