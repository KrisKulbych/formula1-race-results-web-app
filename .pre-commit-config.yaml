default_language_version:
  python: python3.12

repos:
  - repo: local
    hooks:
      - id: ruff
        name: "ruff-lint"
        entry: ruff
        args: ["check"]
        types: [python]
        language: system
      - id: ruff-format
        name: "ruff-format"
        entry: ruff
        args: ["format"]
        types: [python]
        language: system
      - id: mypy
        name: "type annotations check"
        entry: mypy
        args: [".", "--no-incremental"]
        types: [python]
        language: system
        pass_filenames: false
